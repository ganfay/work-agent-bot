services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bidder_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    container_name: bidder_rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RMQ_PASS}
      RABBITMQ_NODENAME: rabbit@rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: bidder_scraper
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      PG_SSLMODE: ${PG_SSLMODE:-disable}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_HOST: rabbitmq
      RMQ_PORT: ${RMQ_PORT:-5672}
      DJINNI_RSS_URL: ${DJINNI_RSS_URL}
      LOG_PATH: ${LOG_PATH:-logs/scraper.log}
      SCRAPE_INTERVAL: ${SCRAPE_INTERVAL:-15m}
      RUN_ONCE: ${RUN_ONCE:-false}
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ai_worker:
    build:
      context: ./ai_worker
      dockerfile: Dockerfile
    container_name: bidder_ai_worker
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      PG_HOST: db
      PG_PORT: ${PG_PORT:-5432}
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_HOST: rabbitmq
      RMQ_PORT: ${RMQ_PORT:-5672}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      AI_LOG_PATH: ${AI_LOG_PATH:-logs/ai_worker.log}
      AI_BATCH_IDLE_TIMEOUT: ${AI_BATCH_IDLE_TIMEOUT:-20s}
      RUN_ONCE: ${RUN_ONCE:-false}
    volumes:
      - ./candidate_profile.json:/app/candidate_profile.json:ro
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  tg_bot:
    build:
      context: ./tg_bot
      dockerfile: Dockerfile
    container_name: bidder_tg_bot
    restart: ${RESTART_POLICY:-unless-stopped}
    environment:
      RMQ_USER: ${RMQ_USER}
      RMQ_PASS: ${RMQ_PASS}
      RMQ_HOST: rabbitmq
      RMQ_PORT: ${RMQ_PORT:-5672}
      TG_BOT_TOKEN: ${TG_BOT_TOKEN}
      TG_USER_ID: ${TG_USER_ID}
      TG_LOG_PATH: ${TG_LOG_PATH:-logs/tg_bot.log}
      TG_BATCH_IDLE_TIMEOUT: ${TG_BATCH_IDLE_TIMEOUT:-90s}
      TG_POLL_GRACE: ${TG_POLL_GRACE:-15s}
      RUN_ONCE: ${RUN_ONCE:-false}
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  db_data:
  rabbitmq_data:
